<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900">
  <!--
    Background skyline for the light login panel.

    Every tone here is capped at #c7d2db. That is the darkest value at which
    the body copy (#475569) still clears 4.5:1, so the copy stays legible
    wherever the artwork lands - no dependence on crop, scale or panel size.
    Depth comes from three pale steps rather than from darkening.
  -->

  <!-- Farthest -->
  <g fill="#e6ebf0">
    <rect x="20" y="540" width="70" height="360"/>
    <rect x="112" y="600" width="58" height="300"/>
    <rect x="196" y="516" width="76" height="384"/>
    <rect x="300" y="584" width="62" height="316"/>
    <rect x="392" y="530" width="70" height="370"/>
    <rect x="486" y="590" width="58" height="310"/>
    <rect x="600" y="452" width="66" height="448"/>
    <rect x="712" y="400" width="72" height="500"/>
    <rect x="840" y="470" width="64" height="430"/>
    <rect x="936" y="424" width="64" height="476"/>
  </g>

  <!-- Middle -->
  <g fill="#d8e0e7">
    <rect x="58" y="636" width="56" height="264"/>
    <rect x="238" y="614" width="52" height="286"/>
    <rect x="352" y="656" width="48" height="244"/>
    <rect x="452" y="628" width="54" height="272"/>
    <path d="M556 900 V486 L580 446 L604 486 V900 Z"/>
    <rect x="660" y="506" width="58" height="394"/>
    <rect x="790" y="454" width="56" height="446"/>
    <path d="M900 900 V436 L924 394 L948 436 V900 Z"/>
  </g>

  <!-- Nearest, still inside the legibility cap -->
  <g fill="#c7d2db">
    <rect x="128" y="716" width="46" height="184"/>
    <rect x="318" y="734" width="44" height="166"/>
    <rect x="516" y="700" width="40" height="200"/>
    <path d="M620 900 V560 L650 524 H676 V900 Z"/>
    <path d="M766 900 V482 L792 436 L818 482 V900 Z"/>
    <rect x="856" y="540" width="50" height="360"/>
    <rect x="962" y="584" width="38" height="316"/>
  </g>

  <!-- Waterline -->
  <rect x="0" y="856" width="1000" height="44" fill="#d3dde5"/>
  <rect x="0" y="856" width="1000" height="3" fill="#c7d2db"/>
</svg>
